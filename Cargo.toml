[package]
name = "gleaming-os"
version = "1.0.0"
edition = "2024"
# The playbook is based on AtlasOS, licensed under the GPL-3.0, see CREDITS.md
license = "GPL-3.0-only"
publish = false

# The binary requires administrator rights, the tests are in the library
[[bin]]
name = "gleaming-os"
test = false

[dependencies]
eframe = "0.37"
egui = "0.37"
include_dir = "0.7"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Power","Win32_Globalization", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
